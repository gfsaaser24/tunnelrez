# PINNED: see docs/PINNED.md. The exact toolchain every crate is built and checked with (CI too), and the targets:
# the Windows sender, app and helpers, and the TV app (armeabi-v7a is what the TV runs; arm64-v8a with -Arm64).
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
targets = ["x86_64-pc-windows-msvc", "armv7-linux-androideabi", "aarch64-linux-android"]
profile = "minimal"
